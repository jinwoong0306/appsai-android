plugins { id 'com.android.application' }

// Public Firebase configuration is supplied locally; an unconfigured checkout still builds.
def firebaseConfigured = file('google-services.json').exists() && !project.hasProperty('firebaseDisabled')
if (firebaseConfigured) apply plugin: 'com.google.gms.google-services'

def characterAssets = layout.buildDirectory.dir('generated/characterAssets')
def copyCharacterAssets = tasks.register('copyCharacterAssets', Sync) {
    into(characterAssets)
    includeEmptyDirs = false
    from(rootProject.file('캐릭터_에셋/09_최종스타일_캐릭터에셋/02_픽셀에셋_128px')) {
        include '*.png'
        into 'characters/latest'
    }
    from(rootProject.file('캐릭터_에셋/07_액세서리_30종/01_장착레이어_64px')) {
        include '*/*.png'
        into 'characters/accessories'
    }
}

android {
    namespace 'kr.example.haliltalk'
    compileSdk 36
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'kr.example.haliltalk'; minSdk 26; targetSdk 35; versionCode 7; versionName '0.5.0-ui'
        testInstrumentationRunner project.hasProperty('geminiProbe') ?
                'kr.example.haliltalk.GeminiConnectionProbe' : 'android.test.InstrumentationTestRunner'
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseConfigured.toString()
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main.assets.srcDir(characterAssets)
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.guava:guava:31.0.1-android'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    releaseImplementation 'com.google.firebase:firebase-appcheck-playintegrity'
}

tasks.named('preBuild').configure {
    dependsOn(copyCharacterAssets)
}

tasks.register('exportPreviewApk', Copy) {
    dependsOn('assembleDebug')
    from(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    into(layout.buildDirectory.dir('outputs/deliverables'))
    rename { 'Appsai-v0.5.0-ui-debug.apk' }
}
