name: 오류 제보
description: 재현 가능한 오류를 기록합니다.
title: "[버그] "
body:
  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      placeholder: "1. ...  2. ...  3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과와 실제 결과
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 기기와 Android 버전
      placeholder: "예: Pixel 7 에뮬레이터, API 35"
  - type: textarea
    id: evidence
    attributes:
      label: 스크린샷 또는 로그
      description: 개인정보와 키를 제거하고 첨부해 주세요.
