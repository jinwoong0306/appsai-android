name: Public baseline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    name: Java Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 폐기된 tools 패키지 대신 현재 compileSdk와 AGP의 필수 패키지를 설치한다.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Build public debug and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app-picker-probe:assembleDebug --no-daemon -PfirebaseDisabled

  worker-check:
    name: Worker tests and bundle dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test Worker contracts and App Check
        run: bun test
      - name: Check Worker bundle without deployment
        run: bun run check
